  """The name of the file"""
  fileName: String!

  """The size of the file in bytes"""
  fileSize: Int!

  """The object id"""
  id: EncodedId!

  """
  The content type of the bytes served at `previewUrl` (so clients need not assume the format). Null when there is no preview.
  """
  previewContentType: String

  """
  A bounded, browser-compatible rendition of the file for previewing. Null when the file has no image preview.
  """
  previewUrl: String

  """The possible statuses for the file"""
  status: NoteFileStatusEnum!

  """The location of the thumbnail"""
  thumbnailUrl: String!

  """The time the note file attachment was updated"""
  updatedAt: ISO8601DateTime!

  """The location of the file"""
  url: String!
}

"""The connection type for NoteFileInterface."""
type NoteFileInterfaceConnection {
  """A list of edges."""
  edges: [NoteFileInterfaceEdge!]

