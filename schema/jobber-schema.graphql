  """
  WORKFLOW_ORDER
}

union NoteCreatedByUnion = Application | Client | User

interface NoteFileInterface {
  """The type of the file"""
  contentType: String!

  """The time the note file attachment was created"""
  createdAt: ISO8601DateTime!

